[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qivision"
version = "0.1.0"
description = "QiVision 望衡 - 智能舌诊与中医辨证 Agent (Qixiangli Health Technology)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "python-multipart>=0.0.9",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "openai>=1.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
qivision = "qivision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qivision = ["web/*.html", "knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
